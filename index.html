<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A little something for you ♡</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--a:#ffb3d9;--b:#c9a7ff;--c:#a8d4ff;--ink:#5b3a7a;--card:rgba(255,255,255,.72);--paper:#fffafd;--pink:#ff6fae;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--a:#a8559a;--b:#6b49b8;--c:#3f6fb5;--ink:#4a2d66;--card:rgba(255,255,255,.8);--paper:#fff3fa}}
:root[data-theme="dark"]{--a:#a8559a;--b:#6b49b8;--c:#3f6fb5;--ink:#4a2d66;--card:rgba(255,255,255,.8);--paper:#fff3fa}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;min-height:100vh;font-family:'Fredoka','Trebuchet MS',sans-serif;color:var(--ink);
background:linear-gradient(135deg,var(--a),var(--b) 50%,var(--c));background-size:300% 300%;animation:bg 14s ease infinite;overflow:hidden}
@keyframes bg{50%{background-position:100% 100%}}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;transition:opacity .8s,transform .8s}
.stage.hide{opacity:0;transform:scale(.9);pointer-events:none;visibility:hidden;transition:opacity .8s,transform .8s,visibility 0s .8s}
.float{position:fixed;bottom:-30px;color:#fff;opacity:.7;animation:up linear forwards;pointer-events:none;z-index:0}
@keyframes up{to{transform:translateY(-115vh) rotate(360deg);opacity:0}}
.card{position:relative;z-index:1;background:var(--card);backdrop-filter:blur(10px);border-radius:32px;padding:30px 24px;width:min(92vw,380px);box-shadow:0 12px 40px rgba(120,70,180,.3)}
h1{margin:0 0 6px;font-size:1.6rem}
.hint{font-size:1.15rem;margin:10px 0 18px}
.hint b{color:var(--pink)}
input{width:100%;padding:14px 18px;border-radius:999px;border:3px solid var(--b);font:inherit;font-size:1.1rem;text-align:center;color:var(--ink);background:#fff;outline:none}
input:focus{border-color:var(--pink)}
button.go{margin-top:14px;padding:12px 30px;border:0;border-radius:999px;font:inherit;font-weight:600;font-size:1.05rem;color:#fff;background:linear-gradient(90deg,var(--pink),#a98bff);cursor:pointer;box-shadow:0 6px 16px rgba(255,111,174,.45);transition:transform .15s}
button.go:active{transform:scale(.94)}
.msg{min-height:1.6em;margin-top:14px;font-weight:600}
.ok{color:var(--pink);font-family:'Caveat','Segoe Script',cursive;font-style:italic;font-weight:700;-webkit-text-stroke:1px var(--pink);font-size:clamp(1rem,5.2vw,1.5rem);white-space:pre;line-height:1.2;animation:pop .5s}
.bad{color:#d6366f}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
/* envelope */
.env{position:relative;width:min(76vw,330px);aspect-ratio:1;cursor:pointer;animation:bob 3s ease-in-out infinite;z-index:1}
@keyframes bob{50%{transform:translateY(-10px)}}
.env>div{position:absolute;inset:0}
.back{background:#e9d6ff;border-radius:14px;box-shadow:0 14px 34px rgba(90,50,150,.35)}
.letter{inset:12% 9% 6% 9%!important;background:var(--paper);border-radius:8px;transition:transform 1s .6s;z-index:1;padding:14px;font-family:'Caveat',cursive;font-size:1.3rem;display:flex;align-items:flex-start;justify-content:center;color:var(--pink)}
.front{background:linear-gradient(135deg,#ffc2e0,#d4b8ff);clip-path:polygon(0 100%,0 38%,50% 64%,100% 38%,100% 100%);z-index:2;border-radius:14px}
.flap{background:linear-gradient(160deg,#ffa6d1,#bda0ff);clip-path:polygon(0 0,100% 0,50% 64%);transform-origin:top;transition:transform .7s,z-index 0s .35s;z-index:3;border-radius:14px 14px 0 0}
.seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:2.2rem;color:#fff;z-index:4;transition:opacity .3s;text-shadow:0 2px 8px rgba(0,0,0,.2);animation:beat 1.2s infinite}
@keyframes beat{50%{transform:translate(-50%,-50%) scale(1.2)}}
.env.open{animation:none}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.env.open .seal{opacity:0}
.env.open .letter{transform:translateY(-38%)}
.tap{margin-top:26px;color:#fff;font-weight:600;animation:beat2 1.4s infinite;z-index:1}
@keyframes beat2{50%{opacity:.4}}
/* letter overlay */
.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));background:rgba(90,50,150,.45);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .7s}
.ov.show{opacity:1;pointer-events:auto}
.paper{background:var(--paper);width:min(94vw,520px);max-height:100%;overflow-y:auto;border-radius:22px;padding:32px 26px;font-family:'Caveat','Segoe Script',cursive;font-size:1.55rem;line-height:1.45;color:var(--ink);box-shadow:0 20px 60px rgba(60,20,110,.5);border:4px dashed var(--b);transform:translateY(40px) rotate(-1.5deg);transition:transform .8s}
.ov.show .paper{transform:none}
.paper h2{margin:0 0 12px;font-size:2.1rem;color:var(--pink)}
.paper p{white-space:pre-line;margin:0 0 14px;opacity:0;transform:translateY(10px);transition:all .8s}
.paper p.in{opacity:1;transform:none}
.close{display:block;margin:10px auto 0;background:none;border:0;font:inherit;font-family:'Fredoka',sans-serif;font-size:1rem;color:var(--ink);opacity:.7;cursor:pointer;text-decoration:underline}
.lang{display:flex;gap:8px;justify-content:center;margin-bottom:12px;font-family:'Fredoka',sans-serif}.lang button{border:2px solid var(--b);background:#fff;color:var(--ink);border-radius:999px;padding:4px 14px;font:inherit;font-size:.9rem;cursor:pointer}.lang button.on{background:var(--pink);border-color:var(--pink);color:#fff}
.ok .e{font-style:normal;-webkit-text-stroke:0}
.tiles{display:flex;gap:10px;justify-content:center;margin:18px 0 8px}.tile{background:#fff;border-radius:18px;padding:10px 0;width:64px}.tile b{display:block;font-size:1.6rem;color:var(--pink)}.tile span{font-size:.7rem;opacity:.7}
.cf{position:fixed;top:-20px;z-index:20;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>

<section class="stage hide" id="cd">
  <div class="card">
    <h1>♡ something’s coming ♡</h1>
    <div class="hint">A little surprise is waiting for you.<br>It opens on <b>8 December</b>.</div>
    <div class="tiles">
      <div class="tile"><b id="d">0</b><span>days</span></div>
      <div class="tile"><b id="h">00</b><span>hours</span></div>
      <div class="tile"><b id="m">00</b><span>min</span></div>
      <div class="tile"><b id="s">00</b><span>sec</span></div>
    </div>
    <div class="msg">no peeking ✦</div>
  </div>
</section>

<section class="stage hide" id="gate">
  <div class="card" id="card">
    <h1>♡ hey you ♡</h1>
    <div class="hint">hint: <b>“What am I to you?”</b></div>
    <input id="pw" type="text" placeholder="type the answer…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <br><button class="go" id="btn">open ✦</button>
    <div class="msg" id="msg"></div>
  </div>
</section>

<section class="stage hide" id="envStage">
  <div class="env" id="env">
    <div class="back"></div>
    <div class="letter">for you ♡</div>
    <div class="front"></div>
    <div class="flap"></div>
    <div class="seal">♥</div>
  </div>
  <div class="tap" id="tap">tap the envelope ✦</div>
</section>

<div class="ov" id="ov">
  <div class="paper" id="paper">
    <div class="lang"><button data-l="en" class="on">English</button><button data-l="de">Deutsch</button><button data-l="tr">Türkçe</button></div>
    <h2 id="lt"></h2>
    <div id="lb"></div>
    <button class="close" id="cl">close</button>
  </div>
</div>

<script>
/* ✏️ MEKTUBUNU BURAYA YAZ — her satır ayrı paragraf olur */
const LETTER_TITLE = "Hi my Soleil ♡";
const LETTER = [
  "First of all, happy birthday, and many, many happy returns! I feel so lucky to have met you.",
  "In such a short time, I started to feel really close to you. I think the reason is your kindness, your respect, your understanding and your warm heart.",
  "Thank you for making time for me and listening to my problems, for bad-mouthing my exes with me, for teaching me new games and new things, and for patiently helping me learn a new language. Thank you for the nights when I laughed until I cried, the nights that made me happy and took away all the tiredness of my day.",
  "These aren’t compliments. They’re things you do, things that are simply true about you. So don’t be shy, and just accept them, dear. I hope we have a beautiful friendship.",
  "Happy 24th birthday again! I hope all your lovely wishes come true, and I wish you only the very best, babe.",
  "With lots of love,\nyour chérie ♡"
];

const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’'`´]/g,"").replace(/\s+/g," ").trim();
const OK=["my cheri","my cherie"];
const L={en:{t:LETTER_TITLE,b:LETTER},de:{t:"Hi, meine Soleil ♡",b:[
  "Zuallererst: alles, alles Gute zum Geburtstag! Ich kann mich wirklich glücklich schätzen, dich kennengelernt zu haben.",
  "In so kurzer Zeit habe ich mich dir richtig nah gefühlt. Ich glaube, der Grund sind deine Freundlichkeit, dein Respekt, dein Verständnis und dein warmes Herz.",
  "Danke, dass du dir Zeit für mich genommen und dir meine Probleme angehört hast, dass du mit mir über meine Exen gelästert hast, mir neue Spiele und neue Dinge beigebracht hast und mir geduldig dabei geholfen hast, eine neue Sprache zu lernen. Danke für die Nächte, in denen ich Tränen gelacht habe, die mich glücklich gemacht und mir die ganze Müdigkeit meines Tages genommen haben.",
  "Das sind keine Komplimente. Das sind Dinge, die du tust, Dinge, die einfach wahr sind. Also sei nicht schüchtern und nimm sie einfach an, meine Liebe. Ich hoffe, wir haben eine schöne Freundschaft.",
  "Nochmals alles Gute zum 24. Geburtstag! Ich hoffe, dass alle deine schönen Wünsche wahr werden, und ich wünsche dir nur das Allerbeste, Süße.",
  "Ganz viel Liebe,\ndeine Chérie ♡"
]},tr:{t:"Hi my Soleil ♡",b:[
  "Öncelikle doğum günün kutlu olsun, nice yaşlara! Seninle tanıştığım için çok şanslıyım.",
  "Kısa sürede seni kendime çok yakın hissettim. Sebebi büyük ihtimalle; kibarlığın, saygılı olman, anlayışlı ve sıcak kalpli olman.",
  "Bana vakit ayırıp dertlerimi dinlediğin, benimle birlikte exlerimi kötülediğin, yeni oyunlar/bilgiler öğrettiğin, sabrıla yeni bir dil öğrenmemde yardım ettiğin, gülmekten ağladığım, mutlu hissettirdiğin, günümün tüm yorgunluğunu alan geceler için teşekkür ederim.",
  "Bunlar iltifat değil; yaptığın, var olan şeyler. O yüzden utanma ve kabul et canım. Umarım güzel bir arkadaşlığımız olur.",
  "24. yaşın tekrardan kutlu olsun. Güzel dileklerinin gerçek olmasını umuyorum ve senin için en iyilerini diliyorum bebeğim.",
  "Seni çok seven\nchérie ♡"
]}};
let cur="en";
function render(l,instant){
  cur=l;$("lt").textContent=L[l].t;$("lb").innerHTML="";
  L[l].b.forEach(t=>{const p=document.createElement("p");p.textContent=t;if(instant)p.className="in";$("lb").appendChild(p)});
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>render(b.dataset.l,true));

/* floating hearts */
const sy=["♡","✦","✧","♥","✿"];
setInterval(()=>{
  const e=document.createElement("span");e.className="float";e.textContent=sy[Math.random()*sy.length|0];
  e.style.left=Math.random()*100+"vw";e.style.fontSize=(12+Math.random()*22)+"px";
  e.style.animationDuration=(6+Math.random()*6)+"s";document.body.appendChild(e);
  setTimeout(()=>e.remove(),12500);
},350);

function confetti(n){
  const cols=["#ff6fae","#c9a7ff","#a8d4ff","#fff","#ffd1e8"];
  for(let i=0;i<n;i++){
    const c=document.createElement("div");c.className="cf";
    c.style.left=Math.random()*100+"vw";
    c.style.width=c.style.height=(6+Math.random()*8)+"px";
    c.style.background=cols[i%cols.length];
    c.style.borderRadius=Math.random()>.5?"50%":"2px";
    c.style.animationDuration=(2+Math.random()*2.5)+"s";
    c.style.animationDelay=Math.random()*.6+"s";
    document.body.appendChild(c);setTimeout(()=>c.remove(),5500);
  }
}

const T=Date.UTC(2026,11,7,23,0,0); /* 8 Dec 2026, 00:00 Berlin time */
let iv;
function tick(){
  const ms=T-Date.now();
  if(ms<=0){clearInterval(iv);$("cd").classList.add("hide");$("gate").classList.remove("hide");confetti(40);return}
  const s=Math.floor(ms/1000),p=n=>String(n).padStart(2,"0");
  $("d").textContent=Math.floor(s/86400);$("h").textContent=p(Math.floor(s%86400/3600));
  $("m").textContent=p(Math.floor(s%3600/60));$("s").textContent=p(s%60);
}
if(Date.now()<T&&location.hash!=="#test"){$("cd").classList.remove("hide");tick();iv=setInterval(tick,1000)}
else{$("gate").classList.remove("hide")}
let done=false;
function check(){
  if(done)return;
  const v=norm($("pw").value);
  if(OK.includes(v)){
    done=true;
    [...$("card").children].forEach(e=>{if(e!==$("msg"))e.style.display="none"});
    $("msg").className="msg ok";$("msg").innerHTML="<span class='e'>🩷😚</span>right answer,\ngood boy<span class='e'>😜🩷</span>";
    const fit=()=>{const m=$("msg");let f=32;m.style.fontSize=f+"px";while(m.scrollWidth>m.clientWidth&&f>10){f--;m.style.fontSize=f+"px"}};
    fit();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
    confetti(50);
    setTimeout(()=>{$("gate").classList.add("hide");$("envStage").classList.remove("hide");},2200);
  }else{
    $("msg").className="msg bad";$("msg").textContent="oops, try again ♡";
    $("card").classList.remove("shake");void $("card").offsetWidth;$("card").classList.add("shake");
  }
}
$("btn").onclick=check;
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")check()});

let opened=false;
$("env").onclick=()=>{
  if(opened)return;opened=true;
  $("env").classList.add("open");$("tap").style.opacity=0;
  confetti(60);
  render(cur);
  setTimeout(()=>{
    $("ov").classList.add("show");
    [...$("lb").children].forEach((p,i)=>setTimeout(()=>p.classList.add("in"),700+i*900));
  },2000);
};
$("cl").onclick=()=>{$("ov").classList.remove("show");$("tap").style.opacity=1;$("tap").textContent="tap to read again ✦";opened=false;$("env").classList.remove("open");};
</script>
</body>
</html>
